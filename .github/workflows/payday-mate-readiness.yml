name: Payday Mate readiness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Payday Mate Readiness Check
        uses: ./
        with:
          run-tests: 'true'
          check-apk: 'true'
          fail-on-unsigned: 'false'
