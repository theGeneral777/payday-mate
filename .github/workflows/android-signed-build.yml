name: Signed Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync android
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYDAYMATE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/payday-mate-upload.jks"
          chmod 600 "$RUNNER_TEMP/payday-mate-upload.jks"
      - name: Build signed release
        working-directory: android
        env:
          PAYDAYMATE_KEYSTORE_PATH: ${{ runner.temp }}/payday-mate-upload.jks
          PAYDAYMATE_KEYSTORE_PASSWORD: ${{ secrets.PAYDAYMATE_KEYSTORE_PASSWORD }}
          PAYDAYMATE_KEY_ALIAS: ${{ secrets.PAYDAYMATE_KEY_ALIAS }}
          PAYDAYMATE_KEY_PASSWORD: ${{ secrets.PAYDAYMATE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Run production readiness gate
        uses: ./
        with:
          run-tests: 'true'
          check-apk: 'false'
          fail-on-unsigned: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: PaydayMate-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/payday-mate-upload.jks"
